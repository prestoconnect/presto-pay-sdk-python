name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --no-build
      - run: uv run --locked --no-build pytest

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
      - run: uv sync --resolution lowest-direct --no-build
      - run: uv run --no-sync --no-build pytest

  sample:
    strategy:
      fail-fast: false
      matrix:
        store: [flask-store, fastapi-store]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sample/${{ matrix.store }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --no-build
      - run: uv run --locked --no-build pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
      - run: uv sync --locked --no-build
      - run: uv run --locked --no-build ruff check .
      - run: uv run --locked --no-build ruff format --check .
      - run: uv run --locked --no-build mypy

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
      - run: uv build
      - name: Wheel ships py.typed and nothing outside the package
        run: |
          unzip -l dist/*.whl | tee wheel.txt
          grep -q 'presto_pay/py.typed' wheel.txt
          ! grep -E ' (spec|tests)/' wheel.txt
      - name: Sdist carries the spec vectors and tests
        run: |
          tar -tzf dist/*.tar.gz | tee sdist.txt
          grep -q '/spec/vectors/canonical.json$' sdist.txt
          grep -q '/spec/keys/presto-staging.der$' sdist.txt
          grep -q '/tests/test_vectors.py$' sdist.txt
      - name: Wheel installs and imports in a clean environment
        run: |
          uv venv /tmp/clean
          uv pip install --no-config --no-build --python /tmp/clean dist/*.whl
          /tmp/clean/bin/python -c "import presto_pay; print(presto_pay.__version__)"

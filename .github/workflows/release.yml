name: Release

# Push a tag like v0.1.0 whose version matches src/presto_pay/_version.py. Publishes through PyPI Trusted
# Publishing, which must list this repository, workflow release.yml and environment pypi as a publisher.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --no-build

      - name: Check tag matches package version
        run: |
          version=$(uv run --locked --no-build python -c "import presto_pay; print(presto_pay.__version__)")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi
          case "${version}" in *dev*) echo "Refusing to release a dev version (${version})" >&2; exit 1;; esac

      - name: Verify (tests, lint, types)
        run: |
          uv run --locked --no-build pytest
          uv run --locked --no-build ruff check .
          uv run --locked --no-build ruff format --check .
          uv run --locked --no-build mypy

      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/presto-pay-sdk/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create the GitHub release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; found = ($2 == v || $2 == "[" v "]"); next }
            found && !/^\[[^]]+\]: / { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists"
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "Python SDK ${GITHUB_REF_NAME}" --notes-file notes.md

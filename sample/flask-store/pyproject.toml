[project]
name = "presto-pay-mystore-flask"
version = "0"
description = "MyStore checkout sample for the Presto Pay Python SDK, on Flask"
requires-python = ">=3.11"
dependencies = [
    "presto-pay-sdk",
    "flask>=3.0",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.uv.sources]
presto-pay-sdk = { path = "../..", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers"]
filterwarnings = [
    "error",
]

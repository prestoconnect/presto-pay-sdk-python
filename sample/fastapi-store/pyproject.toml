[project]
name = "fastapi-store"
version = "0.1.0"
description = "MyStore checkout sample for the Presto Pay Python SDK, on FastAPI"
requires-python = ">=3.11"
dependencies = [
    "presto-pay-sdk",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_store"]

[tool.uv]
# CI syncs with --no-build; these local projects have no wheel to fall back on, so they alone may still be built.
no-binary-package = ["presto-pay-sdk", "fastapi-store"]

[tool.uv.sources]
presto-pay-sdk = { path = "../..", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "."]

[tool.ruff.lint.isort]
known-first-party = ["fastapi_store", "tests"]
known-third-party = ["presto_pay"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[project]
name = "presto-pay-mystore-sample"
version = "0"
description = "MyStore checkout sample for the Presto Pay Python SDK, in Flask and FastAPI"
requires-python = ">=3.11"
dependencies = [
    "presto-pay-sdk",
    "fastapi>=0.110",
    "flask>=3.0",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.uv.sources]
presto-pay-sdk = { path = "..", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers"]
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
